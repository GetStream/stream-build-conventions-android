name: Publish new version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: minor
      suffix:
        description: 'Optional version suffix (e.g. beta, rc01). A dash is added automatically.'
        required: false
        type: string
        default: ''
      publish-targets:
        description: >-
          Leave as-is. Pick central ONLY for the first release after the upload
          action lands, which is the run that puts it on main for @main to find.
        required: false
        type: choice
        options:
          - streamRepo,central
          - central
        default: streamRepo,central

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      bump: ${{ inputs.bump }}
      suffix: ${{ inputs.suffix }}
      # Both, permanently -- not an exception, a dual publish.
      #
      # Central cannot be dropped here the way it can for an SDK: every repo
      # resolves these plugins through pluginManagement, which declares
      # mavenCentral() and the plugin portal and never our repository, so a
      # plugin missing from Central fails the build while settings are still
      # being evaluated. That is a reason to KEEP Central, not a reason to
      # withhold the artifact from our own repository.
      publish-targets: ${{ inputs.publish-targets }}
    secrets:
      github-token: ${{ secrets.STREAM_PUBLIC_BOT_TOKEN }}
      maven-central-username: ${{ secrets.OSSRH_USERNAME }}
      maven-central-password: ${{ secrets.OSSRH_PASSWORD }}
      signing-key: ${{ secrets.SIGNING_KEY }}
      signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
      signing-key-password: ${{ secrets.SIGNING_PASSWORD }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
