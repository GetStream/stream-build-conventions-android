name: Publish new version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: minor
      suffix:
        description: 'Optional version suffix (e.g. beta, rc01). A dash is added automatically.'
        required: false
        type: string
        default: ''
      publish-targets:
        description: >-
          Leave as-is. Pick central ONLY for the first release after the upload
          action lands, which is the run that puts it on main for @main to find.
        required: false
        type: choice
        options:
          - streamRepo
          - streamRepo,central
          - central
        default: streamRepo

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      bump: ${{ inputs.bump }}
      suffix: ${{ inputs.suffix }}
      # The Stream repository only, exactly like an SDK. No dual publish, and no
      # exception for this repo.
      #
      # Nothing breaks, for the same reason it does not break for an SDK: every
      # version already on Central stays there and stays resolvable, so a repo
      # that does not bump its pin never notices. A repo that DOES bump adds our
      # repository to its pluginManagement in the same pull request, because the
      # new version exists nowhere else.
      #
      # There is also no bootstrap deadlock to insure against. This repo's own
      # build applies base, kotlin-jvm, detekt, spotless and dokka -- never the
      # plugin it produces -- so republishing never depends on resolving it.
      #
      # Publishing here only is what makes the pilot mean something: a consumer
      # that lists our repository has to actually reach it, instead of falling
      # back to Central and reporting green while exercising nothing.
      publish-targets: ${{ inputs.publish-targets }}
    secrets:
      github-token: ${{ secrets.STREAM_PUBLIC_BOT_TOKEN }}
      maven-central-username: ${{ secrets.OSSRH_USERNAME }}
      maven-central-password: ${{ secrets.OSSRH_PASSWORD }}
      signing-key: ${{ secrets.SIGNING_KEY }}
      signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
      signing-key-password: ${{ secrets.SIGNING_PASSWORD }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
      stream-repo-endpoint: ${{ secrets.STREAM_REPO_ENDPOINT }}
      stream-repo-bucket: ${{ secrets.STREAM_REPO_BUCKET }}
      stream-repo-access-key-id: ${{ secrets.STREAM_REPO_ACCESS_KEY_ID }}
      stream-repo-secret-access-key: ${{ secrets.STREAM_REPO_SECRET_ACCESS_KEY }}
