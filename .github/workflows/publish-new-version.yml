name: Publish new version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: minor
      suffix:
        description: 'Optional version suffix (e.g. beta, rc01). A dash is added automatically.'
        required: false
        type: string
        default: ''
      publish-targets:
        description: >-
          Leave as-is. Pick central ONLY for the first release after the upload
          action lands, which is the run that puts it on main for @main to find.
        required: false
        type: choice
        options:
          - streamRepo,central
          - central
        default: streamRepo,central

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      bump: ${{ inputs.bump }}
      suffix: ${{ inputs.suffix }}
      # Both, while the repository is being proven -- the same dual-publish
      # window every SDK gets, not a special status.
      #
      # This plugin is the FIRST thing we move, because its failures are the
      # cheapest: a plugin that will not resolve blocks the handful of Android
      # repos we own, and we fix it by editing settings.gradle.kts and pushing.
      # An SDK that will not resolve blocks every customer build, and they can
      # do nothing but wait for us.
      #
      # Central stays in each consumer's pluginManagement list as a fallback,
      # which also covers the one risk unique to this artifact: the pipeline
      # that would republish the plugin resolves the plugin.
      publish-targets: ${{ inputs.publish-targets }}
    secrets:
      github-token: ${{ secrets.STREAM_PUBLIC_BOT_TOKEN }}
      maven-central-username: ${{ secrets.OSSRH_USERNAME }}
      maven-central-password: ${{ secrets.OSSRH_PASSWORD }}
      signing-key: ${{ secrets.SIGNING_KEY }}
      signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
      signing-key-password: ${{ secrets.SIGNING_PASSWORD }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
      stream-repo-endpoint: ${{ secrets.STREAM_REPO_ENDPOINT }}
      stream-repo-bucket: ${{ secrets.STREAM_REPO_BUCKET }}
      stream-repo-access-key-id: ${{ secrets.STREAM_REPO_ACCESS_KEY_ID }}
      stream-repo-secret-access-key: ${{ secrets.STREAM_REPO_SECRET_ACCESS_KEY }}
