name: CI

on:
  pull_request:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  static-checks:
    name: Run static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref_name != github.event.repository.default_branch }}

      - name: Spotless
        run: ./gradlew spotlessCheck

      - name: Detekt
        if: always()
        run: ./gradlew detekt

  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref_name != github.event.repository.default_branch }}

      - name: Build and validate
        run: ./gradlew build :plugin:validatePlugins

  validate-workflows:
    name: Run actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2.2.0
        with:
          # The tool cache is saved only from pushes to the default branch, like the Gradle cache.
          cache: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
