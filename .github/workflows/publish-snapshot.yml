name: Publish Snapshot builds

# Snapshots are published manually only.
on:
  workflow_dispatch:

concurrency:
  group: snapshot-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      bump: patch
      snapshot: true
      # Both, for the reason given in publish-new-version.yml: Central is kept
      # because pluginManagement never sees our repository, not because the
      # plugin is excluded from the migration.
      publish-targets: streamRepo,central
    secrets:
      github-token: ${{ secrets.STREAM_PUBLIC_BOT_TOKEN }}
      maven-central-username: ${{ secrets.OSSRH_USERNAME }}
      maven-central-password: ${{ secrets.OSSRH_PASSWORD }}
      signing-key: ${{ secrets.SIGNING_KEY }}
      signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
      signing-key-password: ${{ secrets.SIGNING_PASSWORD }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
