name: Release Workflow

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version bump type (major, minor, patch)'
        required: true
        type: string
      version-properties-file:
        description: 'Path to properties file containing version'
        required: false
        type: string
        default: 'gradle.properties'
      suffix:
        description: 'Optional version suffix (e.g. beta, rc01). A dash is added automatically.'
        required: false
        type: string
        default: ''
      snapshot:
        description: 'Whether this is a snapshot release'
        required: false
        type: boolean
        default: false
      publish-targets:
        description: >-
          Comma-separated: streamRepo, central, or both. Defaults to the Stream
          repository; Central is a fallback a repo opts into. Nothing changes for
          a repo until it bumps its pinned conventions SHA, so that bump is the
          cutover. Both at once is the dual-publish window.
        required: false
        type: string
        default: 'streamRepo'
      release-notes-card:
        description: >-
          Put a GitHub alert at the top of the release notes. With no message it
          is the Stream repository setup card, which is skipped when central is a
          target and from 2027-01-01. Turn it off for repos whose consumers do not
          add the repository to dependencyResolutionManagement (e.g. a Gradle
          plugin).
        required: false
        type: boolean
        default: true
      release-notes-card-message:
        description: >-
          Markdown for the alert. {tag} is replaced with the release tag. Empty
          means the Stream repository setup card.
        required: false
        type: string
        default: ''
      release-notes-card-level:
        description: 'GitHub alert level: NOTE, TIP, IMPORTANT, WARNING or CAUTION'
        required: false
        type: string
        default: 'IMPORTANT'
    secrets:
      github-token:
        description: 'GitHub token with repo write permissions'
        required: true
      maven-central-username:
        description: 'Maven Central username'
        required: true
      maven-central-password:
        description: 'Maven Central password'
        required: true
      signing-key:
        description: 'GPG signing key'
        required: true
      signing-key-id:
        description: 'GPG signing key ID'
        required: true
      signing-key-password:
        description: 'GPG signing key password'
        required: true
      slack-webhook-url:
        description: 'Slack incoming webhook URL for release notifications'
        required: true
      # Only read by the upload jobs, which never see the signing key. Optional,
      # so a repo publishing to Central alone needs no new secrets at all.
      stream-repo-endpoint:
        description: 'S3 API endpoint of the R2 account hosting the Stream repository'
        required: false
      stream-repo-bucket:
        description: 'Staging bucket name'
        required: false
      stream-repo-access-key-id:
        description: 'R2 access key id, scoped to the staging bucket'
        required: false
      stream-repo-secret-access-key:
        description: 'R2 secret access key'
        required: false

jobs:
  # The release runs in four stages, each its own job:
  #
  #   build ──► upload ──► post-release ──► notify
  #
  # Secrets are injected per job, so each stage holds only what it needs: build
  # has the signing key and never the R2 credential, upload has the R2 credential
  # and never the signing key, notify has only the webhook. Two secrets in one job
  # is one blast radius, and that is exactly what signature verification on the
  # other end is supposed to bound.
  #
  # Nothing is tagged and no GitHub Release exists until post-release, which runs
  # only once the artifacts are resolvable. Every stage records the id of the step
  # that failed, and notify turns that into one message with the exact failure
  # point and what to do about it.

  build:
    name: Build and stage
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.tag.outputs.name }}
      release-branch: ${{ steps.release-branch.outputs.name }}
      failed-step: ${{ steps.record.outputs.failed-step }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.github-token }}
          fetch-depth: 0

      - name: Verify main is merged into develop
        id: verify-main
        # We don't care about this for non-develop branches (e.g. an old v6 branch in chat)
        if: ${{ !inputs.snapshot && github.ref_name == 'develop' }}
        run: |
          git fetch origin main

          # Check if main is fully merged into develop (i.e., main is an ancestor of develop)
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "❌ Error: main branch has commits not in develop!"
            echo ""
            echo "This usually means someone pushed directly into main or a previous release pushed"
            echo "main but failed to push develop. You need to merge main into develop:"
            echo ""
            echo "  git checkout develop"
            echo "  git merge origin/main"
            echo "  git push origin develop"
            echo ""
            echo "After fixing this, you can retry the release."
            exit 1
          fi
          echo "✅ main is fully merged into develop"

      - name: Bump version
        id: bump
        uses: GetStream/stream-build-conventions-android/.github/actions/bump-version@main
        with:
          bump: ${{ inputs.bump }}
          file: ${{ inputs.version-properties-file }}
          suffix: ${{ inputs.suffix }}

      - name: Compute release tag
        id: tag
        if: ${{ !inputs.snapshot }}
        run: echo "name=v${{ steps.bump.outputs.new-version }}" >> "$GITHUB_OUTPUT"

      - name: Check tag doesn't already exist
        id: tag-check
        if: ${{ !inputs.snapshot }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "❌ Error: Tag $TAG already exists!"
            exit 1
          fi
          echo "✅ Tag $TAG is available"

      - name: Compute release branch
        id: release-branch
        if: ${{ !inputs.snapshot }}
        run: echo "name=release-${{ github.ref_name }}-${{ steps.tag.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Commit version file
        id: commit
        if: ${{ !inputs.snapshot }}
        uses: EndBug/add-and-commit@v11.1.1
        with:
          add: ${{ inputs.version-properties-file }}
          message: "AUTOMATION: Version Bump"
          default_author: github_actions
          push: false

      # Force-pushed, so a release dispatched again after a failure simply
      # overwrites the branch the failed run left behind.
      - name: Push to release branch
        id: push-branch
        if: ${{ !inputs.snapshot }}
        run: git push origin "HEAD:${{ steps.release-branch.outputs.name }}" --force

      - name: Setup Gradle
        id: setup-gradle
        uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: false

      - name: Build and publish
        id: publish
        run: ./gradlew publish ${{ inputs.snapshot && 'printAllArtifacts' || '' }} --no-configuration-cache
        env:
          # Passed as an environment variable rather than -P: interpolated into
          # the command line unquoted, a value with a space ("streamRepo, central",
          # which the parser trims and accepts) would split into a second argument
          # and Gradle would fail with "Task 'central' not found".
          ORG_GRADLE_PROJECT_streamPublishTargets: ${{ inputs.publish-targets }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.maven-central-username }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.maven-central-password }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signing-key }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signing-key-id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signing-key-password }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: true
          SNAPSHOT: ${{ inputs.snapshot }}

      # Handed to a job that has never seen the signing key. That split is the
      # whole reason Gradle stages to a directory instead of writing to the
      # bucket itself over the S3 endpoint.
      - name: Hand the staged tree to the upload job
        id: handoff
        if: ${{ contains(inputs.publish-targets, 'streamRepo') }}
        uses: actions/upload-artifact@v7
        with:
          name: stream-repo-staged
          path: build/staged-repo
          retention-days: 1
          if-no-files-found: error

      # conclusion, not outcome: a continue-on-error step that failed is not
      # what stopped the job.
      - name: Record the failed step
        id: record
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          echo "failed-step=$(jq -r 'to_entries | map(select(.value.conclusion == "failure")) | first | .key // ""' <<<"$STEPS")" >> "$GITHUB_OUTPUT"

  upload:
    if: ${{ contains(inputs.publish-targets, 'streamRepo') }}
    needs: build
    name: Upload to the Stream repository
    runs-on: ubuntu-latest
    outputs:
      failed-step: ${{ steps.record.outputs.failed-step }}

    steps:
      - name: Download the staged tree
        id: download
        uses: actions/download-artifact@v8
        with:
          name: stream-repo-staged
          path: build/staged-repo

      - name: Publish to the Stream repository
        id: publish
        uses: GetStream/stream-build-conventions-android/.github/actions/publish-to-stream-repo@main
        with:
          staged-directory: build/staged-repo
          channel: ${{ inputs.snapshot && 'snapshots' || 'releases' }}
          endpoint: ${{ secrets.stream-repo-endpoint }}
          bucket: ${{ secrets.stream-repo-bucket }}
          access-key-id: ${{ secrets.stream-repo-access-key-id }}
          secret-access-key: ${{ secrets.stream-repo-secret-access-key }}

      - name: Record the failed step
        id: record
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          echo "failed-step=$(jq -r 'to_entries | map(select(.value.conclusion == "failure")) | first | .key // ""' <<<"$STEPS")" >> "$GITHUB_OUTPUT"

  post-release:
    # Waits for the upload when the Stream repository is the ONLY target, because
    # then a failed upload means the artifacts are published nowhere, and
    # releasing would announce a version nobody can resolve. When central is also
    # a target the release is live there regardless, and blocking would strand a
    # perfectly good release over a missing second copy.
    #
    # always() is required: without it, a skipped upload job skips this one too.
    if: >-
      ${{ always()
          && !inputs.snapshot
          && needs.build.result == 'success'
          && (needs.upload.result == 'success'
              || needs.upload.result == 'skipped'
              || contains(inputs.publish-targets, 'central')) }}
    needs: [build, upload]
    name: Create GitHub Release and sync branches
    runs-on: ubuntu-latest
    outputs:
      failed-step: ${{ steps.record.outputs.failed-step }}

    steps:
      - name: Check out source branch
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.github-token }}

      - name: Configure git
        id: git-config
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # An optional GitHub alert at the top of the release, above the generated
      # "What's Changed". Part of the body the release is created with, so the
      # release announcement carries it too. With no message given it is the
      # Stream repository setup card, which only makes sense when Central is not
      # a target, so it is dropped there.
      - name: Prepare release notes header
        id: notes
        env:
          TAG: ${{ needs.build.outputs.release-tag }}
          TARGETS: ${{ inputs.publish-targets }}
          WITH_CARD: ${{ inputs.release-notes-card }}
          MESSAGE: ${{ inputs.release-notes-card-message }}
          LEVEL: ${{ inputs.release-notes-card-level }}
          # The default card is a transition notice. From this date it is
          # skipped, so it stops without editing every repo when the transition
          # is over. A custom message is never skipped.
          DEFAULT_CARD_UNTIL: '2027-01-01'
        run: |
          set -euo pipefail
          HEADER="$RUNNER_TEMP/release-header.md"
          : > "$HEADER"
          [ "$WITH_CARD" = "true" ] || exit 0

          LEVEL=$(tr '[:lower:]' '[:upper:]' <<<"$LEVEL")
          case "$LEVEL" in
            NOTE|TIP|IMPORTANT|WARNING|CAUTION) ;;
            *) echo "::error::release-notes-card-level must be NOTE, TIP, IMPORTANT, WARNING or CAUTION, got '$LEVEL'"; exit 1 ;;
          esac

          if [ -z "$MESSAGE" ]; then
            if [[ "$(date -u +%F)" > "$DEFAULT_CARD_UNTIL" || "$(date -u +%F)" == "$DEFAULT_CARD_UNTIL" ]]; then
              echo "Default card skipped: it expired on $DEFAULT_CARD_UNTIL."
              exit 0
            fi
            if [[ "$TARGETS" == *central* ]]; then
              echo "Default card skipped: it says the release is not on Maven Central."
              exit 0
            fi
            MESSAGE=$(cat <<'EOF'
          **`{tag}` is published to the Stream Maven repository, not Maven Central.**

          ```kotlin
          // settings.gradle.kts
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://stream-io-repo.com")
              }
          }
          ```
          EOF
            )
          fi

          {
            echo "> [!$LEVEL]"
            # {tag} in the message is replaced with the release tag.
            sed -e "s|{tag}|$TAG|g" -e 's/^/> /' -e 's/^> $/>/' <<<"$MESSAGE"
            echo
          } > "$HEADER"
          cat "$HEADER"

      - name: Create GitHub Release
        id: release
        uses: ncipollo/release-action@v1.21.0
        with:
          generateReleaseNotes: true
          bodyFile: ${{ runner.temp }}/release-header.md
          # A re-run of this job must not fail on the release it already made.
          skipIfReleaseExists: true
          token: ${{ secrets.github-token }}
          tag: ${{ needs.build.outputs.release-tag }}
          commit: ${{ needs.build.outputs.release-branch }}
          makeLatest: ${{ inputs.suffix == '' && github.ref_name == 'develop' }}
          prerelease: ${{ inputs.suffix != '' }}

      - name: Label released PRs
        id: label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.github-token }}
          RELEASE_BRANCH: ${{ needs.build.outputs.release-branch }}
          CURRENT_TAG: ${{ needs.build.outputs.release-tag }}
        run: |
          # Ensure the 'released' label exists
          gh label create "released" --color "1D76DB" --description "Included in a release" --force

          RELEASE_HEAD="origin/$RELEASE_BRANCH"

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "$RELEASE_HEAD^" 2>/dev/null || echo "")

          # Find PR numbers from commits between previous tag and the release
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$RELEASE_HEAD"
          else
            RANGE="$RELEASE_HEAD"
          fi

          # Extract PR numbers from commit messages, label them, and add comment
          git log --pretty=format:"%s" "$RANGE" | grep -oE '#[0-9]+' | tr -d '#' | sort -u | while read -r pr; do
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --add-label "released" 2>/dev/null || true
              RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$CURRENT_TAG"
              gh pr comment "$pr" --body "🚀 Available in [$CURRENT_TAG]($RELEASE_URL)" 2>/dev/null || true
            fi
          done

      - name: Merge release branch and push to source branch
        id: merge
        run: |
          RELEASE_BRANCH="${{ needs.build.outputs.release-branch }}"
          SOURCE_BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git fetch origin "$RELEASE_BRANCH" "$SOURCE_BRANCH"
            git reset --hard "origin/$SOURCE_BRANCH"
            git merge "origin/$RELEASE_BRANCH" --no-edit
            if git push origin "HEAD:$SOURCE_BRANCH"; then
              echo "✅ Pushed to $SOURCE_BRANCH"
              exit 0
            fi
            echo "⚠️ Push failed (attempt $attempt), retrying..."
          done
          echo "❌ Failed to push to $SOURCE_BRANCH after 3 attempts"
          exit 1

      - name: Sync main with source branch
        id: sync-main
        # We sync main only for develop releases, e.g. if we are releasing a hotfix
        # from an old v6 branch in Chat, we don't want to sync main
        if: ${{ github.ref_name == 'develop' }}
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only "${{ github.ref_name }}"
          git push origin main

      - name: Delete release branch
        id: delete-branch
        run: git push origin --delete ${{ needs.build.outputs.release-branch }}

      - name: Record the failed step
        id: record
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          echo "failed-step=$(jq -r 'to_entries | map(select(.value.conclusion == "failure")) | first | .key // ""' <<<"$STEPS")" >> "$GITHUB_OUTPUT"

  notify:
    # Runs after any outcome, so a failure anywhere is reported, including in
    # post-release. Releases report every outcome; snapshots report failures
    # only, so a successful snapshot does not start this job at all.
    if: ${{ always() && (!inputs.snapshot || contains(needs.*.result, 'failure')) }}
    needs: [build, upload, post-release]
    name: Notify Slack
    runs-on: ubuntu-latest

    steps:
      - name: Compose the message
        id: compose
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
          TARGETS: ${{ inputs.publish-targets }}
          TAG: ${{ needs.build.outputs.release-tag }}
          RELEASE_BRANCH: ${{ needs.build.outputs.release-branch }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_STEP: ${{ needs.build.outputs.failed-step }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
          UPLOAD_STEP: ${{ needs.upload.outputs.failed-step }}
          POST_RESULT: ${{ needs.post-release.result }}
          POST_STEP: ${{ needs.post-release.outputs.failed-step }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          mention="<!subteam^S0117TSPFH7>"
          central=false
          [[ "$TARGETS" == *central* ]] && central=true

          icon() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":no_entry_sign:" ;;
              *) echo ":heavy_minus_sign:" ;;
            esac
          }
          # Step ids as recorded by each job, mapped back to the step names
          # someone will look for in the run.
          step_name() {
            case "$1" in
              checkout) echo "Checkout" ;;
              verify-main) echo "Verify main is merged into develop" ;;
              bump) echo "Bump version" ;;
              tag) echo "Compute release tag" ;;
              tag-check) echo "Check tag doesn't already exist" ;;
              release-branch) echo "Compute release branch" ;;
              commit) echo "Commit version file" ;;
              push-branch) echo "Push to release branch" ;;
              setup-gradle) echo "Setup Gradle" ;;
              publish) echo "${2:-Build and publish}" ;;
              handoff) echo "Hand the staged tree to the upload job" ;;
              download) echo "Download the staged tree" ;;
              git-config) echo "Configure git" ;;
              notes) echo "Prepare release notes header" ;;
              release) echo "Create GitHub Release" ;;
              merge) echo "Merge release branch and push to source branch" ;;
              sync-main) echo "Sync main with source branch" ;;
              delete-branch) echo "Delete release branch" ;;
              "") echo "unknown step" ;;
              *) echo "$1" ;;
            esac
          }
          stage() { # label result failed-step publish-step-name
            local line
            line="$1 $(icon "$2")"
            [[ "$2" == "failure" ]] && line+=" at _$(step_name "${3:-}" "${4:-}")_"
            echo "$line"
          }

          stages="$(stage Build "$BUILD_RESULT" "$BUILD_STEP" "Build and publish")"
          [[ "$TARGETS" == *streamRepo* ]] && stages+=" · $(stage Upload "$UPLOAD_RESULT" "$UPLOAD_STEP" "Publish to the Stream repository")"
          [[ "$SNAPSHOT" != "true" ]] && stages+=" · $(stage Release "$POST_RESULT" "$POST_STEP")"

          failed=""
          for r in "$BUILD_RESULT" "$UPLOAD_RESULT" "$POST_RESULT"; do
            [[ "$r" == "failure" ]] && failed=true
          done
          cancelled=""
          for r in "$BUILD_RESULT" "$UPLOAD_RESULT" "$POST_RESULT"; do
            [[ "$r" == "cancelled" ]] && cancelled=true
          done

          redispatch="Nothing was published and nothing was tagged. Fix the cause and dispatch the release again."
          by_hand="do not dispatch again; finish the release by hand: create the GitHub Release \`$TAG\` on <$REPO_URL/tree/$RELEASE_BRANCH|\`$RELEASE_BRANCH\`>, merge that branch into \`$REF\` (and \`main\`, if applicable), then delete it."

          if [[ "$SNAPSHOT" == "true" ]]; then
            if [[ -z "$failed" ]]; then
              echo "send=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            headline=":x: *Snapshot publish failed* for \`$REPO\` $mention"
            fallback=":x: Snapshot publish failed for $REPO"
            advice=""
          elif [[ -n "$failed" ]]; then
            if [[ "$BUILD_RESULT" == "failure" ]]; then
              headline=":x: *Release failed while building* for \`$REPO\` $mention"
              case "$BUILD_STEP" in
                tag-check)
                  advice="\`$TAG\` already exists, so this version was released before. STOP and investigate before dispatching again." ;;
                publish)
                  if $central; then
                    advice="Publishing may have reached Central: check on Sonatype. If it did not, fix the cause and dispatch the release again. If it did: $by_hand"
                  else
                    advice="$redispatch"
                  fi ;;
                handoff)
                  if $central; then
                    advice="The release was submitted to Central (check on Sonatype that it went through), so $by_hand The Stream repository gets this code with the next release."
                  else
                    advice="$redispatch"
                  fi ;;
                *)
                  advice="$redispatch" ;;
              esac
            elif [[ "$POST_RESULT" == "failure" ]]; then
              case "$POST_STEP" in
                merge)
                  headline=":warning: *Released \`$TAG\` but the branch sync failed* for \`$REPO\` $mention"
                  advice="The artifacts are live and the GitHub Release exists. Merge <$REPO_URL/tree/$RELEASE_BRANCH|\`$RELEASE_BRANCH\`> into \`$REF\` (and \`main\`, if applicable), then delete it. Do not re-run: the release step would fail on the existing tag." ;;
                sync-main)
                  headline=":warning: *Released \`$TAG\` but syncing \`main\` failed* for \`$REPO\` $mention"
                  advice="The artifacts are live, the GitHub Release exists and \`$REF\` is merged. Fast-forward \`main\` to \`$REF\`, then delete \`$RELEASE_BRANCH\`. Do not re-run." ;;
                delete-branch)
                  headline=":warning: *Released \`$TAG\` but could not delete the release branch* for \`$REPO\` $mention"
                  advice="Everything else is done. Delete \`$RELEASE_BRANCH\`." ;;
                release)
                  headline=":warning: *Published \`$TAG\` but could not create the GitHub Release* for \`$REPO\` $mention"
                  advice="The artifacts are live; nothing is tagged yet. Use *Re-run failed jobs*, which repeats only this stage. Do not dispatch the release again." ;;
                *)
                  headline=":warning: *Published \`$TAG\` but the release did not finish* for \`$REPO\` $mention"
                  advice="The artifacts are live. Check whether the GitHub Release \`$TAG\` exists and whether \`$RELEASE_BRANCH\` was merged into \`$REF\`, then finish what is missing by hand. Do not dispatch the release again." ;;
              esac
              # Only reachable with central as a target: otherwise post-release
              # does not run after a failed upload.
              if [[ "$UPLOAD_RESULT" == "failure" ]]; then
                advice+=" The Stream repository upload failed too; only that copy is missing, and it gets this code with the next release."
              fi
            else
              headline=":x: *Upload of \`$TAG\` to the Stream repository failed* for \`$REPO\` $mention"
              if $central; then
                advice="The release is live on Central, so the GitHub Release and the branch sync ran anyway. Only the Stream repository copy is missing; it gets this code with the next release."
              else
                advice="Nothing was tagged or released. Fix the cause and use *Re-run failed jobs* within 24 hours (the staged tree is kept for one day); the GitHub Release and the branch sync follow once the upload succeeds. Do not use *Re-run all jobs*: it rebuilds and re-signs the release from scratch. After 24 hours, dispatch the release again."
              fi
            fi
            fallback="$(sed -e 's/\*//g' -e "s/ $mention//" <<<"$headline")"
          elif [[ -n "$cancelled" ]]; then
            headline=":no_entry_sign: *Release cancelled* for \`$REPO\` $mention"
            fallback=":no_entry_sign: Release cancelled for $REPO"
            advice="Check the stages below: nothing is tagged unless Release finished."
          else
            headline=":rocket: *Released \`$TAG\`* for \`$REPO\`"
            fallback=":android: Released $TAG for $REPO"
            advice=""
          fi

          links="<$RUN_URL|View run>"
          [[ -n "$TAG" && "$POST_RESULT" == "success" ]] && links="<$REPO_URL/releases/tag/$TAG|Release notes> · $links"

          body="$headline"
          [[ -n "$advice" ]] && body+=$'\n'"$advice"

          jq -n --arg text "$fallback" --arg body "$body" --arg stages "$stages" --arg links "$links" '{
            text: $text,
            blocks: [
              { type: "section", text: { type: "mrkdwn", text: $body } },
              { type: "context", elements: [ { type: "mrkdwn", text: $stages } ] },
              { type: "context", elements: [ { type: "mrkdwn", text: $links } ] }
            ]
          }' > "$RUNNER_TEMP/slack-payload.json"
          echo "send=true" >> "$GITHUB_OUTPUT"

      # A Slack error must not turn a finished release red: that invites
      # dispatching it again.
      - name: Post to Slack
        if: ${{ steps.compose.outputs.send == 'true' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload-file-path: ${{ runner.temp }}/slack-payload.json
