name: Release Workflow

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version bump type (major, minor, patch)'
        required: true
        type: string
      version-properties-file:
        description: 'Path to properties file containing version'
        required: false
        type: string
        default: 'gradle.properties'
      suffix:
        description: 'Optional version suffix (e.g. beta, rc01). A dash is added automatically.'
        required: false
        type: string
        default: ''
      snapshot:
        description: 'Whether this is a snapshot release'
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        description: 'GitHub token with repo write permissions'
        required: true
      maven-central-username:
        description: 'Maven Central username'
        required: true
      maven-central-password:
        description: 'Maven Central password'
        required: true
      signing-key:
        description: 'GPG signing key'
        required: true
      signing-key-id:
        description: 'GPG signing key ID'
        required: true
      signing-key-password:
        description: 'GPG signing key password'
        required: true
      slack-webhook-url:
        description: 'Slack incoming webhook URL for release notifications'
        required: true

jobs:
  print-inputs:
    if: ${{ !inputs.snapshot }}
    runs-on: ubuntu-latest
    steps:
      - name: Print release inputs for review
        run: |
          echo "Release inputs:"
          echo "  source branch: ${{ github.ref_name }}"
          echo "  bump: ${{ inputs.bump }}"
          echo "  suffix: ${{ inputs.suffix }}"
          echo "  snapshot: ${{ inputs.snapshot }}"

  approval-gate:
    if: ${{ !inputs.snapshot }}
    needs: print-inputs
    runs-on: ubuntu-latest
    environment: 'publish'
    steps:
      - name: Release approved
        run: echo "Release approved by ${{ github.actor }}"

  publish-snapshot:
    if: ${{ inputs.snapshot }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.github-token }}

      - name: Bump version
        id: bump
        uses: GetStream/stream-build-conventions-android/.github/actions/bump-version@main
        with:
          bump: ${{ inputs.bump }}
          file: ${{ inputs.version-properties-file }}
          suffix: ${{ inputs.suffix }}

      - name: Setup Gradle
        uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: false

      - name: Build and publish snapshot
        run: ./gradlew publish printAllArtifacts --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.maven-central-username }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.maven-central-password }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signing-key }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signing-key-id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signing-key-password }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: true
          SNAPSHOT: true

      - name: Notify Slack on snapshot failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: Snapshot publish failed for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":x: *Snapshot publish failed* for `${{ github.repository }}` <!subteam^S0117TSPFH7>"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  publish-release:
    if: ${{ !inputs.snapshot }}
    needs: approval-gate
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.tag.outputs.name }}
      release-branch: ${{ steps.release-branch.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.github-token }}
          fetch-depth: 0

      - name: Verify main is merged into develop
        # We don't care about this for non-develop branches (e.g. an old v6 branch in chat)
        if: ${{ github.ref_name == 'develop' }}
        run: |
          git fetch origin main
          
          # Check if main is fully merged into develop (i.e., main is an ancestor of develop)
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "❌ Error: main branch has commits not in develop!"
            echo ""
            echo "This usually means someone pushed directly into main or a previous release pushed"
            echo "main but failed to push develop. You need to merge main into develop:"
            echo ""
            echo "  git checkout develop"
            echo "  git merge origin/main"
            echo "  git push origin develop"
            echo ""
            echo "After fixing this, you can retry the release."
            exit 1
          fi
          echo "✅ main is fully merged into develop"

      - name: Bump version
        id: bump
        uses: GetStream/stream-build-conventions-android/.github/actions/bump-version@main
        with:
          bump: ${{ inputs.bump }}
          file: ${{ inputs.version-properties-file }}
          suffix: ${{ inputs.suffix }}

      - name: Compute release tag
        id: tag
        run: echo "name=v${{ steps.bump.outputs.new-version }}" >> "$GITHUB_OUTPUT"

      - name: Check tag doesn't already exist
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "❌ Error: Tag $TAG already exists!"
            exit 1
          fi
          echo "✅ Tag $TAG is available"

      - name: Compute release branch
        id: release-branch
        run: echo "name=release/${{ github.ref_name }}/${{ steps.tag.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Commit version file
        uses: EndBug/add-and-commit@v9.1.4
        with:
          add: ${{ inputs.version-properties-file }}
          message: "AUTOMATION: Version Bump"
          default_author: github_actions
          push: false

      - name: Push to release branch
        run: git push origin "HEAD:${{ steps.release-branch.outputs.name }}" --force

      - name: Create Github Release
        uses: ncipollo/release-action@v1.16.0
        with:
          generateReleaseNotes: true
          token: ${{ secrets.github-token }}
          tag: ${{ steps.tag.outputs.name }}
          commit: ${{ steps.release-branch.outputs.name }}
          makeLatest: ${{ inputs.suffix == '' && github.ref_name == 'develop' }}
          prerelease: ${{ inputs.suffix != '' }}

      - name: Label released PRs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        run: |
          # Ensure the 'released' label exists
          gh label create "released" --color "1D76DB" --description "Included in a release" --force

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG="${{ steps.tag.outputs.name }}"

          # Find PR numbers from commits between previous tag and HEAD
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          # Extract PR numbers from commit messages, label them, and add comment
          git log --pretty=format:"%s" "$RANGE" | grep -oE '#[0-9]+' | tr -d '#' | sort -u | while read -r pr; do
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --add-label "released" 2>/dev/null || true
              RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$CURRENT_TAG"
              gh pr comment "$pr" --body "🚀 Available in [$CURRENT_TAG]($RELEASE_URL)" 2>/dev/null || true
            fi
          done

      - name: Setup Gradle
        uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: false

      - name: Generate Dokka HTML docs
        if: ${{ github.ref_name == 'develop' }}
        run: ./gradlew dokkaHtmlMultimodule

      - name: Publish docs to GitHub pages
        if: ${{ github.ref_name == 'develop' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.github-token }}
          publish_dir: ./build/dokka/htmlMultiModule
          publish_branch: gh-pages

      - name: Build and publish release
        id: publish
        run: ./gradlew publish --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.maven-central-username }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.maven-central-password }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signing-key }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signing-key-id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signing-key-password }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: true
          SNAPSHOT: false

      - name: Notify Slack on pre-publish failure
        if: failure() && steps.publish.conclusion != 'failure'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: Release failed before Maven publishing for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :x: *Release failed before Maven publishing* for `${{ github.repository }}` <!subteam^S0117TSPFH7>
                    Nothing was published to Maven Central. Suggested steps:
                    1. Check the failure in the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
                    2. Verify the release/tag below were created by this run and not by a previous successful release. If they pre-existed, STOP and investigate; otherwise continue with the cleanup below
                       a. <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}|GitHub Release for `${{ steps.tag.outputs.name }}`>: delete if it exists
                       b. <${{ github.server_url }}/${{ github.repository }}/tags|Git tag `${{ steps.tag.outputs.name }}`>: delete after deleting the release
                       c. Retry the release if needed
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

      - name: Notify Slack on publish failure
        if: failure() && steps.publish.conclusion == 'failure'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: Release failed during Maven publishing for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :x: *Release failed during Maven publishing* for `${{ github.repository }}` <!subteam^S0117TSPFH7>
                    Suggested steps:
                    1. Check the failure in the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
                    2. Check on Sonatype to determine whether the release was actually published
                    3. If it WASN'T published, clean up:
                       a. <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}|GitHub Release for `${{ steps.tag.outputs.name }}`>: delete if it exists
                       b. <${{ github.server_url }}/${{ github.repository }}/tags|Git tag `${{ steps.tag.outputs.name }}`>: delete after deleting the release
                       c. Retry the release if needed
                    4. If it WAS published, finish the branch sync manually:
                       a. Merge <${{ github.server_url }}/${{ github.repository }}/tree/${{ steps.release-branch.outputs.name }}|`${{ steps.release-branch.outputs.name }}`> into `${{ github.ref_name }}` (and `main`, if applicable)
                       b. Delete `${{ steps.release-branch.outputs.name }}`
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  sync_branches:
    if: ${{ !inputs.snapshot }}
    needs: publish-release
    name: Sync branches with release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.github-token }}

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Merge release branch and push to source branch
        run: |
          RELEASE_BRANCH="${{ needs.publish-release.outputs.release-branch }}"
          SOURCE_BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git fetch origin "$RELEASE_BRANCH" "$SOURCE_BRANCH"
            git reset --hard "origin/$SOURCE_BRANCH"
            git merge "origin/$RELEASE_BRANCH" --no-edit
            if git push origin "HEAD:$SOURCE_BRANCH"; then
              echo "✅ Pushed to $SOURCE_BRANCH"
              exit 0
            fi
            echo "⚠️ Push failed (attempt $attempt), retrying..."
          done
          echo "❌ Failed to push to $SOURCE_BRANCH after 3 attempts"
          exit 1

      - name: Sync main with source branch
        # We sync main only for develop releases, e.g. if we are releasing a hotfix
        # from an old v6 branch in Chat, we don't want to sync main
        if: ${{ github.ref_name == 'develop' }}
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only "${{ github.ref_name }}"
          git push origin main

      - name: Delete release branch
        run: git push origin --delete ${{ needs.publish-release.outputs.release-branch }}

      - name: Notify Slack on branch sync failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":warning: Released ${{ needs.publish-release.outputs.release-tag }} but branch sync failed for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :warning: *Released `${{ needs.publish-release.outputs.release-tag }}` but branch sync failed* for `${{ github.repository }}` <!subteam^S0117TSPFH7>
                    The release was published successfully, but the post-release branch sync didn't complete. Suggested steps:
                    1. Check the failure in the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
                    2. Merge <${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.publish-release.outputs.release-branch }}|`${{ needs.publish-release.outputs.release-branch }}`> into `${{ github.ref_name }}` (and `main`, if applicable)
                    3. Delete `${{ needs.publish-release.outputs.release-branch }}`
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

      - name: Notify Slack on release success
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":android: Released ${{ needs.publish-release.outputs.release-tag }} for ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":rocket: *Released `${{ needs.publish-release.outputs.release-tag }}`* for `${{ github.repository }}`"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.publish-release.outputs.release-tag }}|Release notes> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
