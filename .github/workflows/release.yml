name: Release Workflow

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version bump type (major, minor, patch)'
        required: true
        type: string
      version-properties-file:
        description: 'Path to properties file containing version'
        required: false
        type: string
        default: 'gradle.properties'
      suffix:
        description: 'Optional version suffix (e.g. beta, rc01). A dash is added automatically.'
        required: false
        type: string
        default: ''
      snapshot:
        description: 'Whether this is a snapshot release'
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        description: 'GitHub token with repo write permissions'
        required: true
      maven-central-username:
        description: 'Maven Central username'
        required: true
      maven-central-password:
        description: 'Maven Central password'
        required: true
      signing-key:
        description: 'GPG signing key'
        required: true
      signing-key-id:
        description: 'GPG signing key ID'
        required: true
      signing-key-password:
        description: 'GPG signing key password'
        required: true

jobs:
  publish-snapshot:
    if: ${{ inputs.snapshot }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.github-token }}

      - name: Bump version
        id: bump
        uses: GetStream/stream-build-conventions-android/.github/actions/bump-version@main
        with:
          bump: ${{ inputs.bump }}
          file: ${{ inputs.version-properties-file }}
          suffix: ${{ inputs.suffix }}

      - name: Setup Gradle
        uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: false

      - name: Build and publish snapshot
        run: ./gradlew publish --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.maven-central-username }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.maven-central-password }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signing-key }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signing-key-id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signing-key-password }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: true
          SNAPSHOT: true

  publish-release:
    if: ${{ !inputs.snapshot }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.github-token }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify main is merged into develop
        # We don't care about this for non-develop branches (e.g. an old v6 branch in chat)
        if: ${{ github.ref_name == 'develop' }}
        run: |
          git fetch origin main
          
          # Check if main is fully merged into develop (i.e., main is an ancestor of develop)
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "❌ Error: main branch has commits not in develop!"
            echo ""
            echo "This usually means someone pushed directly into main or a previous release pushed"
            echo "main but failed to push develop. You need to merge main into develop:"
            echo ""
            echo "  git checkout develop"
            echo "  git merge origin/main"
            echo "  git push origin develop"
            echo ""
            echo "After fixing this, you can retry the release."
            exit 1
          fi
          echo "✅ main is fully merged into develop"

      - name: Bump version
        id: bump
        uses: GetStream/stream-build-conventions-android/.github/actions/bump-version@main
        with:
          bump: ${{ inputs.bump }}
          file: ${{ inputs.version-properties-file }}
          suffix: ${{ inputs.suffix }}

      - name: Commit version file
        uses: EndBug/add-and-commit@v9.1.4
        with:
          add: ${{ inputs.version-properties-file }}
          message: "AUTOMATION: Version Bump"
          default_author: github_actions
          push: false

      - name: Push changes to ci-release branch
        run: git push origin HEAD:ci-release --force-with-lease

      - name: Setup Gradle
        uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: false

      - name: Build and publish release
        run: ./gradlew publish --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.maven-central-username }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.maven-central-password }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signing-key }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signing-key-id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signing-key-password }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: true
          SNAPSHOT: false

      - name: Push version bump to source branch
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Create Github Release
        uses: ncipollo/release-action@v1.16.0
        with:
          generateReleaseNotes: true
          token: ${{ secrets.github-token }}
          tag: v${{ steps.bump.outputs.new-version }}
          commit: ci-release
          makeLatest: ${{ inputs.suffix == '' && github.ref_name == 'develop' }}
          prerelease: ${{ inputs.suffix != '' }}

      - name: Label released PRs
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        run: |
          # Ensure the 'released' label exists
          gh label create "released" --color "1D76DB" --description "Included in a release" --force

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG="v${{ steps.bump.outputs.new-version }}"

          # Find PR numbers from commits between previous tag and HEAD
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          # Extract PR numbers from commit messages, label them, and add comment
          git log --pretty=format:"%s" "$RANGE" | grep -oE '#[0-9]+' | tr -d '#' | sort -u | while read -r pr; do
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --add-label "released" 2>/dev/null || true
              RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$CURRENT_TAG"
              gh pr comment "$pr" --body "🚀 Available in [$CURRENT_TAG]($RELEASE_URL)" 2>/dev/null || true
            fi
          done

      - name: Generate Dokka HTML docs
        run: ./gradlew dokkaHtmlMultimodule

      - name: Publish docs to GitHub pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.github-token }}
          publish_dir: ./build/dokka/htmlMultiModule
          publish_branch: gh-pages

  sync_branches:
    # We sync main with the branch only for actual releases and only for develop, e.g. if we are
    # releasing a hotfix from an old v6 branch in Chat, we don't want to sync main
    if: ${{ !inputs.snapshot && github.ref_name == 'develop' }}
    needs: publish-release
    name: Sync main and develop with release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.github-token }}

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Sync main with ci-release
        run: |
          git fetch origin ci-release
          git merge --ff-only origin/ci-release

      - name: Sync develop with main
        run: |
          git fetch origin develop
          git checkout develop
          git merge --no-edit main

      - name: Push both branches
        run: |
          git push origin main
          git push origin develop
