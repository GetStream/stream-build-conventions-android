name: Release Workflow

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version bump type (major, minor, patch)'
        required: true
        type: string
      version-properties-file:
        description: 'Path to properties file containing version'
        required: false
        type: string
        default: 'gradle.properties'
      suffix:
        description: 'Optional version suffix (e.g. beta, rc01). A dash is added automatically.'
        required: false
        type: string
        default: ''
      snapshot:
        description: 'Whether this is a snapshot release'
        required: false
        type: boolean
        default: false
      publish-targets:
        description: >-
          Comma-separated: streamRepo, central, or both. Defaults to the Stream
          repository; Central is a fallback a repo opts into. Nothing changes for
          a repo until it bumps its pinned conventions SHA, so that bump is the
          cutover. Both at once is the dual-publish window.
        required: false
        type: string
        default: 'streamRepo'
    secrets:
      github-token:
        description: 'GitHub token with repo write permissions'
        required: true
      maven-central-username:
        description: 'Maven Central username'
        required: true
      maven-central-password:
        description: 'Maven Central password'
        required: true
      signing-key:
        description: 'GPG signing key'
        required: true
      signing-key-id:
        description: 'GPG signing key ID'
        required: true
      signing-key-password:
        description: 'GPG signing key password'
        required: true
      slack-webhook-url:
        description: 'Slack incoming webhook URL for release notifications'
        required: true
      # Only read by the upload jobs, which never see the signing key. Optional,
      # so a repo publishing to Central alone needs no new secrets at all.
      stream-repo-endpoint:
        description: 'S3 API endpoint of the R2 account hosting the Stream repository'
        required: false
      stream-repo-bucket:
        description: 'Staging bucket name'
        required: false
      stream-repo-access-key-id:
        description: 'R2 access key id, scoped to the staging bucket'
        required: false
      stream-repo-secret-access-key:
        description: 'R2 secret access key'
        required: false

jobs:
  publish-snapshot:
    if: ${{ inputs.snapshot }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.github-token }}

      - name: Bump version
        id: bump
        uses: GetStream/stream-build-conventions-android/.github/actions/bump-version@main
        with:
          bump: ${{ inputs.bump }}
          file: ${{ inputs.version-properties-file }}
          suffix: ${{ inputs.suffix }}

      - name: Setup Gradle
        uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: false

      - name: Build and publish snapshot
        run: ./gradlew publish printAllArtifacts --no-configuration-cache
        env:
          # Passed as an environment variable rather than -P: interpolated into
          # the command line unquoted, a value with a space ("streamRepo, central",
          # which the parser trims and accepts) would split into a second argument
          # and Gradle would fail with "Task 'central' not found".
          ORG_GRADLE_PROJECT_streamPublishTargets: ${{ inputs.publish-targets }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.maven-central-username }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.maven-central-password }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signing-key }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signing-key-id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signing-key-password }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: true
          SNAPSHOT: true

      # Handed to a job that has never seen the signing key. That split is the
      # whole reason Gradle stages to a directory instead of writing to the
      # bucket itself over the S3 endpoint.
      - name: Hand the staged tree to the upload job
        if: ${{ contains(inputs.publish-targets, 'streamRepo') }}
        uses: actions/upload-artifact@v4
        with:
          name: stream-repo-staged-snapshot
          path: build/staged-repo
          retention-days: 1
          if-no-files-found: error

      - name: Notify Slack on snapshot failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: Snapshot publish failed for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":x: *Snapshot publish failed* for `${{ github.repository }}` <!subteam^S0117TSPFH7>"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  publish-release:
    if: ${{ !inputs.snapshot }}
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.tag.outputs.name }}
      release-branch: ${{ steps.release-branch.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.github-token }}
          fetch-depth: 0

      - name: Verify main is merged into develop
        # We don't care about this for non-develop branches (e.g. an old v6 branch in chat)
        if: ${{ github.ref_name == 'develop' }}
        run: |
          git fetch origin main
          
          # Check if main is fully merged into develop (i.e., main is an ancestor of develop)
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "❌ Error: main branch has commits not in develop!"
            echo ""
            echo "This usually means someone pushed directly into main or a previous release pushed"
            echo "main but failed to push develop. You need to merge main into develop:"
            echo ""
            echo "  git checkout develop"
            echo "  git merge origin/main"
            echo "  git push origin develop"
            echo ""
            echo "After fixing this, you can retry the release."
            exit 1
          fi
          echo "✅ main is fully merged into develop"

      - name: Bump version
        id: bump
        uses: GetStream/stream-build-conventions-android/.github/actions/bump-version@main
        with:
          bump: ${{ inputs.bump }}
          file: ${{ inputs.version-properties-file }}
          suffix: ${{ inputs.suffix }}

      - name: Compute release tag
        id: tag
        run: echo "name=v${{ steps.bump.outputs.new-version }}" >> "$GITHUB_OUTPUT"

      - name: Check tag doesn't already exist
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "❌ Error: Tag $TAG already exists!"
            exit 1
          fi
          echo "✅ Tag $TAG is available"

      - name: Compute release branch
        id: release-branch
        run: echo "name=release-${{ github.ref_name }}-${{ steps.tag.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Commit version file
        uses: EndBug/add-and-commit@v11.1.1
        with:
          add: ${{ inputs.version-properties-file }}
          message: "AUTOMATION: Version Bump"
          default_author: github_actions
          push: false

      - name: Push to release branch
        run: git push origin "HEAD:${{ steps.release-branch.outputs.name }}" --force

      - name: Setup Gradle
        uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: false

      - name: Build and publish release
        id: publish
        run: ./gradlew publish --no-configuration-cache
        env:
          # See the note on the snapshot job: -P would word-split on a space.
          ORG_GRADLE_PROJECT_streamPublishTargets: ${{ inputs.publish-targets }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.maven-central-username }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.maven-central-password }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signing-key }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signing-key-id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signing-key-password }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: true
          SNAPSHOT: false

      - name: Hand the staged tree to the upload job
        id: handoff
        if: ${{ contains(inputs.publish-targets, 'streamRepo') }}
        uses: actions/upload-artifact@v4
        with:
          name: stream-repo-staged-release
          path: build/staged-repo
          retention-days: 1
          if-no-files-found: error

      # The three failure notifications below are mutually exclusive and keyed on
      # how far the publish step got. Nothing is tagged and no GitHub Release
      # exists yet: both are created at the end of the run, once the artifacts are
      # live. The hand-off case needs its own message because it runs AFTER a
      # successful publish, which may already have reached Central.
      - name: Notify Slack on hand-off failure
        if: failure() && steps.publish.outcome == 'success'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: Built ${{ steps.tag.outputs.name }} but could not hand over the staged tree for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :x: *Built `${{ steps.tag.outputs.name }}` but could not hand over the staged tree* for `${{ github.repository }}` <!subteam^S0117TSPFH7>
                    The publish step succeeded; handing the tree to the upload job did not, so the Stream repository upload never ran. No tag or GitHub Release was created. Suggested steps:
                    1. Check the failure in the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
                    2. If `central` was among the publish targets, the release was submitted there (check on Sonatype that it went through). Do not dispatch again; finish the release by hand:
                       a. Create the GitHub Release `${{ steps.tag.outputs.name }}` on <${{ github.server_url }}/${{ github.repository }}/tree/${{ steps.release-branch.outputs.name }}|`${{ steps.release-branch.outputs.name }}`>
                       b. Merge `${{ steps.release-branch.outputs.name }}` into `${{ github.ref_name }}` (and `main`, if applicable), then delete it
                       The Stream repository will only get this code with the next release.
                    3. If it was not, nothing is published anywhere. Fix the cause and dispatch the release again.
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

      - name: Notify Slack on pre-publish failure
        if: failure() && steps.publish.outcome == 'skipped'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: Release failed before Maven publishing for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :x: *Release failed before Maven publishing* for `${{ github.repository }}` <!subteam^S0117TSPFH7>
                    Nothing was published, and no tag or GitHub Release was created. Suggested steps:
                    1. Check the failure in the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
                    2. If it stopped at the tag check, that version is already released: STOP and investigate
                    3. Otherwise fix the cause and dispatch the release again
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

      - name: Notify Slack on publish failure
        if: failure() && steps.publish.outcome == 'failure'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: Release failed during Maven publishing for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :x: *Release failed during Maven publishing* for `${{ github.repository }}` <!subteam^S0117TSPFH7>
                    No tag or GitHub Release was created. Suggested steps:
                    1. Check the failure in the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
                    2. If `central` was not among the publish targets, nothing is published anywhere. Fix the cause and dispatch the release again.
                    3. If it was, check on Sonatype whether the release went through:
                       a. It WASN'T published: fix the cause and dispatch the release again
                       b. It WAS published: do not dispatch again. Create the GitHub Release `${{ steps.tag.outputs.name }}` on <${{ github.server_url }}/${{ github.repository }}/tree/${{ steps.release-branch.outputs.name }}|`${{ steps.release-branch.outputs.name }}`>, merge that branch into `${{ github.ref_name }}` (and `main`, if applicable), then delete it
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  # --- Stream repository upload -------------------------------------------
  #
  # Separate jobs, because secrets are injected per job: these hold the R2
  # credential and never the signing key, and the publish jobs above hold the
  # signing key and never the R2 credential. Two secrets in one job is one blast
  # radius, and that is exactly what signature verification on the other end is
  # supposed to bound.
  #
  # sync_branches (which creates the GitHub Release) waits for these only when
  # the Stream repository is the sole target. While both targets are live,
  # Central is still authoritative; a fault in the new path must not strand a
  # finished release with its branches unmerged. It fails the run so we see it.

  upload-snapshot-to-stream-repo:
    if: ${{ inputs.snapshot && contains(inputs.publish-targets, 'streamRepo') }}
    needs: publish-snapshot
    name: Upload snapshot to the Stream repository
    runs-on: ubuntu-latest
    steps:
      - name: Download the staged tree
        uses: actions/download-artifact@v4
        with:
          name: stream-repo-staged-snapshot
          path: build/staged-repo

      - name: Publish to the Stream repository
        uses: GetStream/stream-build-conventions-android/.github/actions/publish-to-stream-repo@main
        with:
          staged-directory: build/staged-repo
          channel: snapshots
          endpoint: ${{ secrets.stream-repo-endpoint }}
          bucket: ${{ secrets.stream-repo-bucket }}
          access-key-id: ${{ secrets.stream-repo-access-key-id }}
          secret-access-key: ${{ secrets.stream-repo-secret-access-key }}

      - name: Notify Slack on upload failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: Snapshot upload to the Stream repository failed for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":x: *Snapshot upload to the Stream repository failed* for `${{ github.repository }}` <!subteam^S0117TSPFH7>"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  upload-release-to-stream-repo:
    if: ${{ !inputs.snapshot && contains(inputs.publish-targets, 'streamRepo') }}
    needs: publish-release
    name: Upload release to the Stream repository
    runs-on: ubuntu-latest
    steps:
      - name: Download the staged tree
        uses: actions/download-artifact@v4
        with:
          name: stream-repo-staged-release
          path: build/staged-repo

      - name: Publish to the Stream repository
        uses: GetStream/stream-build-conventions-android/.github/actions/publish-to-stream-repo@main
        with:
          staged-directory: build/staged-repo
          channel: releases
          endpoint: ${{ secrets.stream-repo-endpoint }}
          bucket: ${{ secrets.stream-repo-bucket }}
          access-key-id: ${{ secrets.stream-repo-access-key-id }}
          secret-access-key: ${{ secrets.stream-repo-secret-access-key }}

      - name: Notify Slack on upload failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: Upload of ${{ needs.publish-release.outputs.release-tag }} to the Stream repository failed for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :x: *Upload of `${{ needs.publish-release.outputs.release-tag }}` to the Stream repository failed* for `${{ github.repository }}` <!subteam^S0117TSPFH7>
                    Suggested steps:
                    1. Check the failure in the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
                    2. Fix the cause, then use *Re-run failed jobs* within 24 hours (the staged tree is kept for one day). Do not use "Re-run all jobs": it rebuilds and re-signs the release from scratch.
                    3. If `central` was not a target, nothing was tagged or released: the GitHub Release and the branch sync wait for the upload and run once the re-run succeeds. After 24 hours, just dispatch the release again.
                    4. If `central` was a target, the release is live there, so the GitHub Release and the branch sync ran anyway; only the Stream repository copy is missing, and it will only get this code with the next release.
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  sync_branches:
    # Tags, creates the GitHub Release and syncs branches. Waits for the upload
    # when the Stream repository is the ONLY target, because then a failed upload
    # means the artifacts are published nowhere, and releasing would announce a
    # version nobody can resolve. When central is also a target the release is
    # live there regardless, and blocking would strand a perfectly good release
    # over a missing second copy.
    #
    # always() is required: without it, a skipped upload job skips this one too.
    if: >-
      ${{ always()
          && !inputs.snapshot
          && needs.publish-release.result == 'success'
          && (needs.upload-release-to-stream-repo.result == 'success'
              || needs.upload-release-to-stream-repo.result == 'skipped'
              || contains(inputs.publish-targets, 'central')) }}
    needs: [publish-release, upload-release-to-stream-repo]
    name: Create GitHub Release and sync branches
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.github-token }}

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # The GitHub Release is the last thing to appear, so the release
      # announcement (the GitHub Slack app posts on publish) only goes out once
      # the artifacts are resolvable. It is created here, after the upload job
      # has seen the Stream repository report PUBLISHED.
      - name: Create GitHub Release
        id: release
        uses: ncipollo/release-action@v1.21.0
        with:
          generateReleaseNotes: true
          # A re-run of this job must not fail on the release it already made.
          skipIfReleaseExists: true
          token: ${{ secrets.github-token }}
          tag: ${{ needs.publish-release.outputs.release-tag }}
          commit: ${{ needs.publish-release.outputs.release-branch }}
          makeLatest: ${{ inputs.suffix == '' && github.ref_name == 'develop' }}
          prerelease: ${{ inputs.suffix != '' }}

      - name: Label released PRs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        run: |
          # Ensure the 'released' label exists
          gh label create "released" --color "1D76DB" --description "Included in a release" --force

          RELEASE_BRANCH="${{ needs.publish-release.outputs.release-branch }}"
          CURRENT_TAG="${{ needs.publish-release.outputs.release-tag }}"
          RELEASE_HEAD="origin/$RELEASE_BRANCH"

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "$RELEASE_HEAD^" 2>/dev/null || echo "")

          # Find PR numbers from commits between previous tag and the release
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$RELEASE_HEAD"
          else
            RANGE="$RELEASE_HEAD"
          fi

          # Extract PR numbers from commit messages, label them, and add comment
          git log --pretty=format:"%s" "$RANGE" | grep -oE '#[0-9]+' | tr -d '#' | sort -u | while read -r pr; do
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --add-label "released" 2>/dev/null || true
              RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$CURRENT_TAG"
              gh pr comment "$pr" --body "🚀 Available in [$CURRENT_TAG]($RELEASE_URL)" 2>/dev/null || true
            fi
          done

      - name: Merge release branch and push to source branch
        run: |
          RELEASE_BRANCH="${{ needs.publish-release.outputs.release-branch }}"
          SOURCE_BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git fetch origin "$RELEASE_BRANCH" "$SOURCE_BRANCH"
            git reset --hard "origin/$SOURCE_BRANCH"
            git merge "origin/$RELEASE_BRANCH" --no-edit
            if git push origin "HEAD:$SOURCE_BRANCH"; then
              echo "✅ Pushed to $SOURCE_BRANCH"
              exit 0
            fi
            echo "⚠️ Push failed (attempt $attempt), retrying..."
          done
          echo "❌ Failed to push to $SOURCE_BRANCH after 3 attempts"
          exit 1

      - name: Sync main with source branch
        # We sync main only for develop releases, e.g. if we are releasing a hotfix
        # from an old v6 branch in Chat, we don't want to sync main
        if: ${{ github.ref_name == 'develop' }}
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only "${{ github.ref_name }}"
          git push origin main

      - name: Delete release branch
        run: git push origin --delete ${{ needs.publish-release.outputs.release-branch }}

      - name: Notify Slack on GitHub Release failure
        # Also catches a failed checkout, which skips the release step.
        if: failure() && steps.release.outcome != 'success'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":warning: Published ${{ needs.publish-release.outputs.release-tag }} but the release did not finish for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :warning: *Published `${{ needs.publish-release.outputs.release-tag }}` but the release did not finish* for `${{ github.repository }}` <!subteam^S0117TSPFH7>
                    The artifacts are live. Do not dispatch the release again. Suggested steps:
                    1. Check the failure in the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
                    2. If the GitHub Release `${{ needs.publish-release.outputs.release-tag }}` does not exist, create it on <${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.publish-release.outputs.release-branch }}|`${{ needs.publish-release.outputs.release-branch }}`>, with generated notes
                    3. Merge `${{ needs.publish-release.outputs.release-branch }}` into `${{ github.ref_name }}` (and `main`, if applicable), then delete it
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

      - name: Notify Slack on branch sync failure
        if: failure() && steps.release.outcome == 'success'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":warning: Released ${{ needs.publish-release.outputs.release-tag }} but branch sync failed for ${{ github.repository }} <!subteam^S0117TSPFH7>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :warning: *Released `${{ needs.publish-release.outputs.release-tag }}` but branch sync failed* for `${{ github.repository }}` <!subteam^S0117TSPFH7>
                    The release was published successfully, but the post-release branch sync didn't complete. Suggested steps:
                    1. Check the failure in the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
                    2. Merge <${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.publish-release.outputs.release-branch }}|`${{ needs.publish-release.outputs.release-branch }}`> into `${{ github.ref_name }}` (and `main`, if applicable)
                    3. Delete `${{ needs.publish-release.outputs.release-branch }}`
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

      - name: Notify Slack on release success
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":android: Released ${{ needs.publish-release.outputs.release-tag }} for ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":rocket: *Released `${{ needs.publish-release.outputs.release-tag }}`* for `${{ github.repository }}`"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.publish-release.outputs.release-tag }}|Release notes> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
