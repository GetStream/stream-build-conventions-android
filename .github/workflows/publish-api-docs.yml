name: Publish API Docs

# Builds the Dokka HTML site and pushes it to the gh-pages branch. Kept out of
# release.yml so artifact publishing never waits on it; callers trigger it on
# push to main, which the release workflow fast-forwards after each release.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build the docs from. Defaults to the triggering commit.'
        required: false
        type: string
        default: ''
    secrets:
      github-token:
        description: 'Token with write access to the gh-pages branch. Defaults to GITHUB_TOKEN.'
        required: false
      slack-webhook-url:
        description: 'Slack incoming webhook URL for failure notifications'
        required: false

concurrency:
  group: api-docs-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish-api-docs:
    # A manual run from any other branch would replace the live docs with
    # unreleased APIs. Called runs see the caller's event and ref.
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Gradle
        uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main

      - name: Generate Dokka HTML docs
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Publish docs to GitHub pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.github-token || github.token }}
          publish_dir: ./build/dokka/html
          publish_branch: gh-pages

      - name: Notify Slack on docs failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack-webhook-url }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":warning: API docs publish failed for ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":warning: *API docs publish failed* for `${{ github.repository }}`. The release is unaffected; the docs site is behind until this is re-run."
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
