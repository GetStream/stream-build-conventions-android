name: Android CI

on:
  workflow_call:
    inputs:
      api-check:
        description: 'Whether to run API checks'
        required: false
        type: boolean
        default: true
      save-gradle-cache:
        description: 'Whether pushes to the default branch save the Gradle cache. Call gradle-cache-cleanup.yml after this workflow when enabled.'
        required: false
        type: boolean
        default: false

    secrets:
      BUILD_CACHE_AWS_REGION:
        required: false
      BUILD_CACHE_AWS_BUCKET:
        required: false
      BUILD_CACHE_AWS_ACCESS_KEY_ID:
        required: false
      BUILD_CACHE_AWS_SECRET_KEY:
        required: false
      SONAR_TOKEN:
        required: false

env:
  # Repos that turn the local build cache off on CI check this. With the Gradle cache saved, task outputs land in it
  # on default-branch pushes and every run reuses them.
  GRADLE_LOCAL_BUILD_CACHE: ${{ inputs.save-gradle-cache && 'true' || 'false' }}
  BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
  BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
  BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
  BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: ${{ !inputs.save-gradle-cache || github.event_name != 'push' || github.ref_name != github.event.repository.default_branch }}
      - name: Build
        run: ./gradlew assembleDebug --scan

  static-checks:
    name: Run static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: ${{ !inputs.save-gradle-cache || github.event_name != 'push' || github.ref_name != github.event.repository.default_branch }}
      - name: Spotless
        run: ./gradlew spotlessCheck
      - name: Lint
        if: always()
        run: ./gradlew lint
      - name: API check
        if: always() && inputs.api-check
        run: ./gradlew apiCheck

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # For Sonar analysis
      - uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@main
        with:
          cache-read-only: ${{ !inputs.save-gradle-cache || github.event_name != 'push' || github.ref_name != github.event.repository.default_branch }}
      - name: Run unit tests
        run: ./gradlew :testCoverage --scan --stacktrace
      - name: Upload tests results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-tests-results
          path: ./**/build/reports/tests/**
      - name: Sonar
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning title=Sonar skipped::SONAR_TOKEN is not set, so the Sonar analysis did not run."
            exit 0
          fi
          ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Sonar skipped if PR from fork
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: echo "⚠️ Sonar skipped because the PR comes from a fork."
      - name: Sonar skipped for Dependabot PR
        if: github.actor == 'dependabot[bot]'
        run: echo "⚠️ Sonar skipped because Dependabot PRs do not have access to SONAR_TOKEN."

  validate-workflows:
    name: Run actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2.2.0
        with:
          # The tool cache is saved only from pushes to the default branch, like the Gradle cache.
          cache: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
