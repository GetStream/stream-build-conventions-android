version: 2
updates:
  - package-ecosystem: github-actions
    # The composite actions under .github/actions are only checked when listed.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    labels:
      - "pr:workflows"

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
    labels:
      - "pr:gradle-plugins"
