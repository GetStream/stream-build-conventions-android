name: 'Bump Version'
description: 'Bumps a semantic version based on the specified bump type'

inputs:
  bump:
    description: 'Version bump type (major, minor, patch, or none)'
    required: true
  file:
    description: 'Path to properties file containing version (must have version=X.Y.Z format)'
    required: false
    default: 'gradle.properties'
  suffix:
    description: 'Optional version suffix (e.g. beta, rc01). A dash is added automatically.'
    required: false
    default: ''
  version-key:
    description: 'Key name for version in the properties file'
    required: false
    default: 'version'

outputs:
  new-version:
    description: 'The new version after bumping'
    value: ${{ steps.calculate.outputs.new_version }}

runs:
  using: 'composite'
  steps:
    - name: Calculate and update version
      id: calculate
      shell: bash
      run: |
        FILE="${{ inputs.file }}"
        VERSION_KEY="${{ inputs.version-key }}"
        BUMP="${{ inputs.bump }}"
        
        # Read current version from file
        if [[ ! -f "$FILE" ]]; then
          echo "Error: File '$FILE' not found"
          exit 1
        fi
        
        CURRENT=$(grep "^${VERSION_KEY}=" "$FILE" | cut -d'=' -f2)
        if [[ -z "$CURRENT" ]]; then
          echo "Error: Could not find '${VERSION_KEY}=' in $FILE"
          exit 1
        fi
        echo "Read version from $FILE: $CURRENT"
        
        # Strip any existing suffix (e.g. -beta, -rc01) before validation
        BASE_VERSION="${CURRENT%%-*}"

        # Validate base version format
        if ! [[ $BASE_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: Invalid version format '$CURRENT'. Expected format: X.Y.Z or X.Y.Z-suffix"
          exit 1
        fi
        CURRENT="$BASE_VERSION"
        
        # Validate bump type
        if [[ ! "$BUMP" =~ ^(major|minor|patch|none)$ ]]; then
          echo "Error: Invalid bump type '$BUMP'. Must be: major, minor, patch, or none"
          exit 1
        fi

        # Parse version
        IFS='.' read -r major minor patch <<< "$CURRENT"

        # Calculate new version
        case "$BUMP" in
          major) NEW="$((major+1)).0.0" ;;
          minor) NEW="$major.$((minor+1)).0" ;;
          patch) NEW="$major.$minor.$((patch+1))" ;;
          none) NEW="$major.$minor.$patch" ;;
        esac
        
        # Append suffix if provided
        SUFFIX="${{ inputs.suffix }}"
        if [[ -n "$SUFFIX" ]] && ! [[ "$SUFFIX" =~ ^[a-zA-Z0-9._+-]+$ ]]; then
          echo "Error: Invalid suffix '$SUFFIX'. Only alphanumerics, dots, underscores, hyphens, and plus signs are allowed."
          exit 1
        fi
        if [[ -n "$SUFFIX" ]]; then
          FULL_VERSION="${NEW}-${SUFFIX}"
        else
          FULL_VERSION="${NEW}"
        fi

        # Update file with new version
        sed -i "s/^${VERSION_KEY}=.*/${VERSION_KEY}=$FULL_VERSION/" "$FILE"
        echo "Updated $FILE: ${VERSION_KEY}=$CURRENT → ${VERSION_KEY}=$FULL_VERSION"

        echo "new_version=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "Bumped version from $CURRENT to $FULL_VERSION (bump type: $BUMP)"
